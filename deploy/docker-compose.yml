services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - matjar_postgres_data:/var/lib/postgresql/data
    networks: [matjar]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_NAME: ${APP_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
      SOCIAL_PUBLISH_ENABLED: ${SOCIAL_PUBLISH_ENABLED}
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [matjar]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ai-service:
    build:
      context: ../ai-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8010
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS}
    ports:
      - "127.0.0.1:8010:8010"
    networks: [matjar]

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      SERVER_URL: http://evolution-api:8080
      SERVER_PORT: 8080
      LANGUAGE: en
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolution_db?schema=evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
    volumes:
      - evolution_instances:/evolution/instances
    networks: [matjar]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    networks: [matjar]
    expose:
      - "6379"

volumes:
  matjar_postgres_data:
  evolution_instances:
  evolution_redis:

networks:
  matjar:
    name: matjar-net
